name: Update Linux visual baselines

# Regenerates tests/visual/__snapshots__/linux/ on Linux and commits the
# result directly to the branch the workflow was started from (main by
# default). Run it after an intentional visual change so CI compares against
# the new look.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate Linux baselines
        run: pnpm test:visual --update-snapshots
        env:
          CI: "1"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__snapshots__/linux
          if git diff --cached --quiet; then
            echo "Linux baselines are unchanged."
            exit 0
          fi
          git commit -m "chore(visual): update linux baselines"
          git push origin HEAD:${GITHUB_REF_NAME}
