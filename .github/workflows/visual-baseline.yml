name: Update Linux visual baselines

# Regenerates tests/visual/__snapshots__/linux/ on Linux. The result is always
# uploaded as the `visual-baselines-linux` artifact; the workflow also tries to
# commit it to the branch it was started from, which only works when branch
# rules allow github-actions[bot] to push. Otherwise pull the artifact in:
#
#   gh run download <run-id> -n visual-baselines-linux -D tests/visual/__snapshots__/linux
#   git add tests/visual/__snapshots__/linux && git commit -m "chore(visual): update linux baselines"
#
# Run it after an intentional visual change so CI compares against the new look.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate Linux baselines
        run: pnpm test:visual --update-snapshots
        env:
          CI: "1"

      - name: Upload Linux baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/__snapshots__/linux/
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push (best effort)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__snapshots__/linux
          if git diff --cached --quiet; then
            echo "Linux baselines are unchanged."
            exit 0
          fi
          git commit -m "chore(visual): update linux baselines"
          if git push origin HEAD:"${GITHUB_REF_NAME}"; then
            echo "Pushed Linux baselines to ${GITHUB_REF_NAME}."
          else
            echo "::warning::Push rejected by branch rules. Download the visual-baselines-linux artifact from this run and commit it: gh run download ${GITHUB_RUN_ID} -n visual-baselines-linux -D tests/visual/__snapshots__/linux"
          fi
