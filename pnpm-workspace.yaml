# Force the patched postcss everywhere: next pins 8.4.31 exactly, which is
# below the security-advisory floor (>=8.5.10). Drop once next bumps it.
overrides:
  postcss: '>=8.5.10'

allowBuilds:
  # Postinstall scripts that must run (binaries / native builds).
  cloudflared: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Scripts intentionally not run (funding notices / version stamping only).
  # Same effective behavior as before the pnpm 11 migration.
  '@google/genai': false
  core-js: false
  protobufjs: false
