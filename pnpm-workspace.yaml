# Security floors for transitive packages used to live here (postcss, sharp)
# while next held them below the advisory line. next 16.3.x now pins postcss
# 8.5.23 and declares sharp ^0.35.3, so no overrides are needed. If a future
# next release regresses a floor, re-add the override with a pointer to the
# advisory it covers.

allowBuilds:
  # Postinstall scripts that must run (binaries / native builds).
  cloudflared: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Scripts intentionally not run (funding notices / version stamping only).
  # Same effective behavior as before the pnpm 11 migration.
  '@google/genai': false
  core-js: false
  protobufjs: false

# pnpm 11's optimistic repeat-install can silently skip config/lockfile
# changes (pnpm/pnpm#12100 family); always re-validate instead.
optimisticRepeatInstall: false
