# Upstream ranges still select vulnerable versions. Keep each override scoped
# to its consumer and verify PPTX export, math rendering, and ESLint after updates.
overrides:
  # GHSA-5p2g-fcmc-qvqq / GHSA-w3rx-r6r6-pgpr
  'pptxgenjs>image-size': 2.1.0
  # GHSA-238p-pmpm-9mq7; use the same renderer for MDX and application CSS.
  katex: 0.19.1
  # GHSA-g3hv-75wg-m249; typescript-estree uses the retained Minimatch API.
  '@typescript-eslint/typescript-estree>minimatch': 11.0.5

allowBuilds:
  # Postinstall scripts that must run (binaries / native builds).
  cloudflared: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Scripts intentionally not run (funding notices / version stamping only).
  # Same effective behavior as before the pnpm 11 migration.
  '@google/genai': false
  core-js: false
  protobufjs: false

# pnpm 11's optimistic repeat-install can silently skip config/lockfile
# changes (pnpm/pnpm#12100 family); always re-validate instead.
optimisticRepeatInstall: false
